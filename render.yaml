services:
  - type: web
    name: adhirath-ai
    env: python
    plan: free
    rootDir: ai-service
    pythonVersion: 3.10.13
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn predict_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
